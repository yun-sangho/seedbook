<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Seedbook</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1c20; --muted: #6b6e76; --btn: #1a1c20; --btn-fg: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #16171b; --fg: #f3f4f5; --muted: #9a9ca3; --btn: #f3f4f5; --btn-fg: #16171b; }
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
      button { margin-top: 12px; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 16px; font-weight: 600;
        background: var(--btn); color: var(--btn-fg); }
    </style>
  </head>
  <body>
    <main>
      <h1>연결할 수 없어요</h1>
      <p>인터넷 연결을 확인한 뒤<br />다시 시도해주세요.</p>
      <button type="button" id="retry">다시 시도</button>
    </main>
    <script>
      // 빌드 때 scripts/build-www.mjs 가 서버 주소로 바꾼다.
      const SERVER_URL = "__SERVER_URL__";
      const reopen = () => window.location.replace(SERVER_URL);
      document.getElementById("retry").addEventListener("click", reopen);
      // 연결이 돌아오면 자동으로 다시 연다.
      window.addEventListener("online", reopen);
    </script>
  </body>
</html>
