name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: stock-crawler
            dockerfile: apps/stock-crawler/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # 서버가 ARM64 (OCI Ampere) 라 GitHub runner (x86_64) 에서 cross-build.
      # QEMU 가 binfmt 핸들러를 등록해 buildx 가 arm64 stage 를 emulation 으로 빌드한다.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # deployer 홈 디렉토리 아래에 둔다 — sudo 없이 mkdir 가능. 서버에 SSH 만
      # 되면 별도 디렉토리 사전 준비 없이 바로 배포된다.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/seedbook' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || 22 }}
    steps:
      # 서버에는 git/소스 트리가 없다. runner 가 docker-compose.yml 만 sparse
      # checkout 해서 scp 로 올린다. 코드는 GHCR 이미지 안에만 존재.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull & restart
        uses: appleboy/ssh-action@v1.2.0
        # 런타임 env 는 모두 GitHub Secrets/Variables. SSH 세션에 export 하면
        # docker compose 가 shell env 로 ${VAR} 치환을 처리한다.
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          WEB_PORT: ${{ vars.WEB_PORT || '127.0.0.1:3001' }}
          CRON_MORNING: ${{ vars.CRON_MORNING }}
          CRON_AFTERNOON: ${{ vars.CRON_AFTERNOON }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: IMAGE_TAG,DATABASE_URL,BETTER_AUTH_SECRET,BETTER_AUTH_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,WEB_PORT,CRON_MORNING,CRON_AFTERNOON
          command_timeout: 8m
          script_stop: true
          # ${{ env.DEPLOY_PATH }} 가 ~ 로 시작할 수 있으므로 따옴표를 두르지
          # 않는다 (bash 의 ~ 확장은 unquoted context 에서만 동작). mkdir -p 로
          # 디렉토리가 없으면 만들어 둔다 — 첫 배포에서 생성됨.
          script: |
            set -euo pipefail
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
