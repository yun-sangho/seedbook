name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: stock-crawler
            dockerfile: apps/stock-crawler/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # 서버가 ARM64 (OCI Ampere) 라 GitHub runner (x86_64) 에서 cross-build.
      # QEMU 가 binfmt 핸들러를 등록해 buildx 가 arm64 stage 를 emulation 으로 빌드한다.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # deployer 홈 디렉토리 아래에 둔다 — sudo 없이 mkdir 가능. 서버에 SSH 만
      # 되면 별도 디렉토리 사전 준비 없이 바로 배포된다.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/seedbook' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || 22 }}
    steps:
      # 서버에는 git/소스 트리가 없다. runner 가 docker-compose.yml 만 sparse
      # checkout 해서 scp 로 올린다. 코드는 GHCR 이미지 안에만 존재.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull & restart
        uses: appleboy/ssh-action@v1.2.0
        # 런타임 env 는 모두 GitHub Secrets/Variables. SSH 세션에 export 한 뒤
        # 서버 디렉토리에 .env 파일로 써둔다. docker compose 는 같은 디렉토리의
        # .env 를 자동으로 로드하므로, 이후 임의의 `docker compose ...` 명령
        # (logs/ps/exec) 도 env 검증 없이 그대로 동작한다. .env 는 매 배포마다
        # 덮어쓰므로 GitHub Secrets 가 여전히 단일 소스.
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          WEB_PORT: ${{ vars.WEB_PORT || '127.0.0.1:3001' }}
          CRON_MORNING: ${{ vars.CRON_MORNING }}
          CRON_AFTERNOON: ${{ vars.CRON_AFTERNOON }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: IMAGE_TAG,DATABASE_URL,BETTER_AUTH_SECRET,BETTER_AUTH_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,WEB_PORT,CRON_MORNING,CRON_AFTERNOON
          command_timeout: 8m
          script_stop: true
          # ${{ env.DEPLOY_PATH }} 가 ~ 로 시작할 수 있으므로 따옴표를 두르지
          # 않는다 (bash 의 ~ 확장은 unquoted context 에서만 동작).
          script: |
            set -euo pipefail
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # KEY=VALUE 라인을 0600 권한으로 .env 에 저장. printf 라 $ 확장
            # 없음 — secret 값에 $ 들어가도 그대로 보존. 다음 임의의 docker
            # compose 명령은 같은 디렉토리의 .env 를 자동 로드한다.
            umask 077
            {
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
              printf 'BETTER_AUTH_URL=%s\n' "$BETTER_AUTH_URL"
              printf 'KAKAO_CLIENT_ID=%s\n' "$KAKAO_CLIENT_ID"
              printf 'KAKAO_CLIENT_SECRET=%s\n' "$KAKAO_CLIENT_SECRET"
              printf 'WEB_PORT=%s\n' "$WEB_PORT"
              printf 'CRON_MORNING=%s\n' "$CRON_MORNING"
              printf 'CRON_AFTERNOON=%s\n' "$CRON_AFTERNOON"
            } > .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
