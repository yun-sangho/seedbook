name: CI

# 깨끗한 checkout 에서 포맷 · lint · 타입 · 테스트 · 빌드를 확인한다. 로컬 작업 트리에만 있고
# 커밋되지 않은 파일에 기대는 커밋도 여기서 걸린다.
#   - PR 마다 실행 (DB 통합 테스트는 DB 관련 경로가 바뀐 PR 에서만 — "DB 테스트 대상 판단")
#   - main push 때는 deploy-web.yml · deploy-crawler.yml 이 이 워크플로를 먼저 불러, 통과해야 이미지 빌드/배포로 간다.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # DB 통합 테스트 (`test:db`). apps/web/test/db 의 기본 URL 과 같은 계정을 쓴다 —
      # 테스트가 `seedbook_test` DB 를 만들고 drizzle 마이그레이션을 적용한다.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seedbook
          POSTGRES_PASSWORD: seedbook
          POSTGRES_DB: seedbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seedbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Next.js 빌드 중 익명 통계 전송 끄기.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # PR 은 GitHub 이 만든 머지 커밋을 받는다. 부모(베이스)까지 받아 두면 `HEAD^1..HEAD` 가
      # 이 PR 이 바꾼 파일이다 (아래 "DB 테스트 대상 판단").
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # DB 통합 테스트는 PR 에서는 DB 를 쓰는 코드가 바뀌었을 때만 돌린다. main push (deploy.yml
      # 이 workflow_call 로 부름) · 수동 실행에서는 항상 돌린다 — 아래 목록이 놓친 간접 의존도
      # 배포 전에는 잡힌다. 건너뛰어도 job (`checks`) 은 성공으로 끝난다.
      # 목록: *.db.test.ts 가 부르는 코드 (server · storage 번역기 · auth · sync) 와 그 코드가
      # 가져오는 features·lib 모듈, database·domain 패키지, 테스트 설정, 의존성, 이 워크플로.
      - name: DB 테스트 대상 판단
        id: db
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='\.db\.test\.ts$'
          pattern+='|^packages/(database|domain)/'
          pattern+='|^apps/web/(server|test/db|app/api)/'
          pattern+='|^apps/web/lib/(auth|apple-auth|stock-quotes)'
          pattern+='|^apps/web/test/(sync|legal)/'
          pattern+='|^apps/mobile/src/lib/(auth|storage-|account-header|login-flow)'
          pattern+='|^apps/mobile/src/lib/(sync|legal|seed-identity|native/device-db)/'
          pattern+='|^apps/mobile/src/features/[^/]+/(types|sync)/'
          pattern+='|^apps/mobile/src/features/settings/utils/(data-backup|backup-ids|reassign-ids)'
          pattern+='|^apps/mobile/src/features/portfolio/utils/portfolio-links'
          pattern+='|^apps/mobile/src/features/rebalancing/utils/(collapsed-sections|sort-rebalancing-tasks)'
          pattern+='|^apps/web/(vitest\.db\.config\.ts|package\.json|tsconfig\.json)$'
          pattern+='|^scripts/worktree'
          pattern+='|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc)$'
          pattern+='|^\.github/workflows/ci\.yml$'
          matched=$(git diff --name-only HEAD^1 HEAD | grep -E "$pattern" || true)
          if [ -n "$matched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            { echo "DB 통합 테스트: 실행 — DB 관련 파일이 바뀜"; echo '```'; echo "$matched"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "DB 통합 테스트: 건너뜀 — DB 관련 경로 변경 없음" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 버전은 package.json 의 packageManager (pnpm@8.15.6) 를 따른다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # web 의 타입 / 테스트 / 빌드가 database 패키지의 dist 를 쓴다.
      - name: Build database package
        run: pnpm --filter @seedbook/database build

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      # 동기화 레코드 정의가 출시 스냅샷과 호환되는지 (확장/깨는 변경 분류, MIN_SCHEMA). 설계 §7.5.
      - name: Schema compatibility
        run: pnpm schema:check

      - name: Domain unit tests
        run: pnpm --filter @seedbook/domain test

      - name: Unit tests
        run: pnpm --filter @seedbook/web test

      - name: App unit tests
        run: pnpm --filter @seedbook/mobile test

      - name: Crawler unit tests
        run: pnpm --filter @seedbook/stock-crawler test

      - name: DB integration tests
        if: steps.db.outputs.run == 'true'
        run: pnpm --filter @seedbook/web test:db

      # 웹 빌드가 앱 화면(Vite SPA) 빌드 결과를 public/_app 으로 복사해 같이 서빙한다.
      - name: Build app
        run: pnpm --filter @seedbook/mobile build

      - name: Build web
        run: pnpm --filter @seedbook/web build
