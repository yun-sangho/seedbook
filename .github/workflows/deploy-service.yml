name: Deploy service

# 서비스 하나의 이미지를 빌드·push 하고 서버에서 그 서비스만 새 태그로 바꾼다.
# deploy-web.yml · deploy-crawler.yml 이 CI 통과 뒤 부른다 (workflow_call).
on:
  workflow_call:
    inputs:
      service:
        description: "서비스 이름 = 이미지 이름 = apps/<service>/Dockerfile (web | stock-crawler)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}
  # Node 20 deprecation 대응 — 사용 중인 액션들 (checkout, docker/*) 이
  # 자체 runtime 을 Node 24 로 올릴 때까지의 임시 opt-in. 2026-06-02 부터
  # Node 24 가 기본이 되면 이 변수는 제거 가능.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    # 서버가 ARM64 (OCI Ampere). public repo 는 ubuntu-*-arm runner 를 무료로
    # 쓸 수 있어 native arm64 빌드로 진행 — QEMU emulation 단계 불필요.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ inputs.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ inputs.service }}/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # web 번들이 기기 레코드에 쓴 번들을 남긴다 (writtenBy). crawler 는 쓰지 않는다.
          build-args: |
            APP_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

  deploy:
    needs: build
    # build 와 동일한 arm runner. SSH 액션들만 돌리는 단계라 arch 의존성은
    # 없지만 일관성 + 큐 분리 회피 차원에서 같이 맞춘다.
    runs-on: ubuntu-24.04-arm
    # 다른 서비스 배포가 서버 잠금을 쥐고 있으면 기다린다 (아래 flock).
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # deployer 홈 디렉토리 아래에 둔다 — sudo 없이 mkdir 가능. 서버에 SSH 만
      # 되면 별도 디렉토리 사전 준비 없이 바로 배포된다.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/seedbook' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || 22 }}
    steps:
      # 서버에는 git/소스 트리가 없다. runner 가 docker-compose.yml 만 sparse
      # checkout 해서 scp 로 올린다. 코드는 GHCR 이미지 안에만 존재.
      # web·crawler 배포가 동시에 돌 수 있으니 서비스별 자리(.compose/<service>/)에 올리고,
      # 서버의 배포 잠금 안에서 docker-compose.yml 로 옮긴다.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Stage compose file
        env:
          SERVICE: ${{ inputs.service }}
        run: mkdir -p ".compose/$SERVICE" && cp docker-compose.yml ".compose/$SERVICE/"

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: .compose/${{ inputs.service }}/docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull & restart
        uses: appleboy/ssh-action@v1.2.0
        # 런타임 env 는 모두 GitHub Secrets/Variables. SSH 세션에 export 한 뒤
        # 서버 디렉토리에 .env 파일로 써둔다. docker compose 는 같은 디렉토리의
        # .env 를 자동으로 로드하므로, 이후 임의의 `docker compose ...` 명령
        # (logs/ps/exec) 도 env 검증 없이 그대로 동작한다. .env 는 매 배포마다
        # 덮어쓰므로 GitHub Secrets 가 여전히 단일 소스.
        env:
          SERVICE: ${{ inputs.service }}
          # 이 서비스만 새 sha, 다른 서비스는 빈 값 → 서버 .env 의 기존 태그 유지.
          WEB_IMAGE_TAG: ${{ inputs.service == 'web' && github.sha || '' }}
          CRAWLER_IMAGE_TAG: ${{ inputs.service == 'stock-crawler' && github.sha || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_NATIVE_APP_KEY: ${{ vars.KAKAO_NATIVE_APP_KEY }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
          APPLE_APP_BUNDLE_ID: ${{ vars.APPLE_APP_BUNDLE_ID }}
          APP_BUNDLE_ADMIN_TOKEN: ${{ secrets.APP_BUNDLE_ADMIN_TOKEN }}
          WEB_PORT: ${{ vars.WEB_PORT || '127.0.0.1:3001' }}
          CRON_MORNING: ${{ vars.CRON_MORNING }}
          CRON_AFTERNOON: ${{ vars.CRON_AFTERNOON }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: SERVICE,WEB_IMAGE_TAG,CRAWLER_IMAGE_TAG,DATABASE_URL,BETTER_AUTH_SECRET,BETTER_AUTH_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_NATIVE_APP_KEY,APPLE_CLIENT_ID,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY_BASE64,APPLE_APP_BUNDLE_ID,APP_BUNDLE_ADMIN_TOKEN,WEB_PORT,CRON_MORNING,CRON_AFTERNOON
          command_timeout: 18m
          script_stop: true
          # ${{ env.DEPLOY_PATH }} 가 ~ 로 시작할 수 있으므로 따옴표를 두르지
          # 않는다 (bash 의 ~ 확장은 unquoted context 에서만 동작).
          script: |
            set -euo pipefail
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # web·crawler 배포가 동시에 돌 수 있다. .env 를 읽고 다시 쓰는 동안 다른 배포가
            # 끼어들면 그쪽의 새 태그를 옛 값으로 덮으므로, 서버에서 한 번에 하나만 진행한다.
            # flock 은 프로세스가 끝나면(SSH 끊김 포함) 잠금을 자동으로 푼다.
            exec 9>.deploy.lock
            flock -w 600 9

            cp ".compose/$SERVICE/docker-compose.yml" docker-compose.yml

            # GitHub Secret 입력칸에 줄바꿈/공백이 끝에 따라가는 사고를 막기 위해
            # 각 값에서 trailing CR/LF 와 공백을 stripping 한다. shell env 자체를
            # 정제해야 docker compose 의 ${VAR} interpolation 이 깨끗한 값을 본다
            # (compose 는 shell env 를 .env 파일보다 우선시함).
            # KAKAO_CLIENT_ID 에 trailing \n 이 들어가 KOE101 이 났던 실사례 방지.
            strip() {
              printf '%s' "$1" | sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//'
            }
            # 이번에 배포하지 않는 서비스는 지난 배포의 .env 에 적힌 태그를 그대로 쓴다.
            # 잠금 안에서 읽으므로 동시에 돈 다른 서비스 배포의 새 태그도 지켜진다.
            # (IMAGE_TAG 는 서비스별 태그로 나뉘기 전의 공용 키 — 전환 후 첫 배포 때만 쓰인다.)
            prev() {
              if [ -f .env ]; then sed -n "s/^$1=//p" .env | tail -n 1; fi
            }
            WEB_IMAGE_TAG=$(strip "$WEB_IMAGE_TAG")
            CRAWLER_IMAGE_TAG=$(strip "$CRAWLER_IMAGE_TAG")
            WEB_IMAGE_TAG=${WEB_IMAGE_TAG:-$(prev WEB_IMAGE_TAG)}
            WEB_IMAGE_TAG=${WEB_IMAGE_TAG:-$(prev IMAGE_TAG)}
            WEB_IMAGE_TAG=${WEB_IMAGE_TAG:-latest}
            CRAWLER_IMAGE_TAG=${CRAWLER_IMAGE_TAG:-$(prev CRAWLER_IMAGE_TAG)}
            CRAWLER_IMAGE_TAG=${CRAWLER_IMAGE_TAG:-$(prev IMAGE_TAG)}
            CRAWLER_IMAGE_TAG=${CRAWLER_IMAGE_TAG:-latest}
            echo "deploy $SERVICE — web: $WEB_IMAGE_TAG / stock-crawler: $CRAWLER_IMAGE_TAG"
            DATABASE_URL=$(strip "$DATABASE_URL")
            BETTER_AUTH_SECRET=$(strip "$BETTER_AUTH_SECRET")
            BETTER_AUTH_URL=$(strip "$BETTER_AUTH_URL")
            KAKAO_CLIENT_ID=$(strip "$KAKAO_CLIENT_ID")
            KAKAO_CLIENT_SECRET=$(strip "$KAKAO_CLIENT_SECRET")
            KAKAO_NATIVE_APP_KEY=$(strip "$KAKAO_NATIVE_APP_KEY")
            APPLE_CLIENT_ID=$(strip "$APPLE_CLIENT_ID")
            APPLE_TEAM_ID=$(strip "$APPLE_TEAM_ID")
            APPLE_KEY_ID=$(strip "$APPLE_KEY_ID")
            APPLE_PRIVATE_KEY_BASE64=$(strip "$APPLE_PRIVATE_KEY_BASE64")
            APPLE_APP_BUNDLE_ID=$(strip "$APPLE_APP_BUNDLE_ID")
            APP_BUNDLE_ADMIN_TOKEN=$(strip "$APP_BUNDLE_ADMIN_TOKEN")
            WEB_PORT=$(strip "$WEB_PORT")
            CRON_MORNING=$(strip "$CRON_MORNING")
            CRON_AFTERNOON=$(strip "$CRON_AFTERNOON")
            export WEB_IMAGE_TAG CRAWLER_IMAGE_TAG DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL \
              KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_NATIVE_APP_KEY APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID \
              APPLE_PRIVATE_KEY_BASE64 APPLE_APP_BUNDLE_ID APP_BUNDLE_ADMIN_TOKEN WEB_PORT CRON_MORNING CRON_AFTERNOON

            # 추가로 .env 파일에도 동일 값을 0600 권한으로 저장 — 이후 사용자가
            # SSH 로 직접 docker compose ... 명령을 실행할 때 env 가 비어있어
            # compose interpolation 이 실패하는 일을 방지.
            umask 077
            {
              printf 'WEB_IMAGE_TAG=%s\n' "$WEB_IMAGE_TAG"
              printf 'CRAWLER_IMAGE_TAG=%s\n' "$CRAWLER_IMAGE_TAG"
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
              printf 'BETTER_AUTH_URL=%s\n' "$BETTER_AUTH_URL"
              printf 'KAKAO_CLIENT_ID=%s\n' "$KAKAO_CLIENT_ID"
              printf 'KAKAO_CLIENT_SECRET=%s\n' "$KAKAO_CLIENT_SECRET"
              printf 'KAKAO_NATIVE_APP_KEY=%s\n' "$KAKAO_NATIVE_APP_KEY"
              printf 'APPLE_CLIENT_ID=%s\n' "$APPLE_CLIENT_ID"
              printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID"
              printf 'APPLE_KEY_ID=%s\n' "$APPLE_KEY_ID"
              printf 'APPLE_PRIVATE_KEY_BASE64=%s\n' "$APPLE_PRIVATE_KEY_BASE64"
              printf 'APPLE_APP_BUNDLE_ID=%s\n' "$APPLE_APP_BUNDLE_ID"
              printf 'APP_BUNDLE_ADMIN_TOKEN=%s\n' "$APP_BUNDLE_ADMIN_TOKEN"
              printf 'WEB_PORT=%s\n' "$WEB_PORT"
              printf 'CRON_MORNING=%s\n' "$CRON_MORNING"
              printf 'CRON_AFTERNOON=%s\n' "$CRON_AFTERNOON"
            } > .env

            # 이 서비스 이미지만 받는다. up -d 는 전체를 맞추지만 태그·설정이 그대로인
            # 다른 서비스는 재시작되지 않는다 (compose 파일이 바뀌었으면 함께 반영된다).
            docker compose pull "$SERVICE"
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
