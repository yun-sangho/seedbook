name: ${COMPOSE_PROJECT_NAME:-seedbook-dev}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seedbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seedbook}
      POSTGRES_DB: ${POSTGRES_DB:-seedbook}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seedbook}"]
      interval: 5s
      timeout: 5s
      retries: 5

  stock-crawler:
    build:
      context: .
      dockerfile: apps/stock-crawler/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seedbook}:${POSTGRES_PASSWORD:-seedbook}@postgres:5432/${POSTGRES_DB:-seedbook}
      CRON_MORNING: ${CRON_MORNING:-0 6 * * 1-5}
      CRON_AFTERNOON: ${CRON_AFTERNOON:-30 16 * * 1-5}
      RUN_NOW: ${RUN_NOW:-true}
      NODE_ENV: development
    volumes:
      - ./apps/stock-crawler/src:/app/apps/stock-crawler/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/database/prisma:/app/packages/database/prisma
      - ./packages/database/scripts:/app/packages/database/scripts

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Docker for Mac (VirtioFS) 는 bind mount 에서 발생한 fs change 이벤트를
    # 컨테이너로 거의 전파하지 못한다. Next.js 의 turbopack 워처는 Rust 의
    # native notify 만 쓰고 폴링 fallback 이 없어 HMR 이 깨진다.
    # 컨테이너 안에서만 webpack 모드 + WATCHPACK_POLLING 으로 떨어뜨려 우회한다.
    # 호스트 `pnpm dev` 는 그대로 turbopack 을 쓴다.
    command: pnpm --filter @seedbook/web exec next dev --port 3001
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seedbook}:${POSTGRES_PASSWORD:-seedbook}@postgres:5432/${POSTGRES_DB:-seedbook}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-placeholder-override-in-production-8f2k1m9xq7h4}
      BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3001}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NODE_ENV: development
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3001}:3001"
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/features:/app/apps/web/features
      - ./apps/web/hooks:/app/apps/web/hooks
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/types:/app/apps/web/types
      - ./apps/web/utils:/app/apps/web/utils
      - ./apps/web/public:/app/apps/web/public
      - ./packages/database/src:/app/packages/database/src
      - ./packages/database/prisma:/app/packages/database/prisma
      - ./packages/database/scripts:/app/packages/database/scripts

volumes:
  postgres_data_dev:
