services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seedbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seedbook}
      POSTGRES_DB: ${POSTGRES_DB:-seedbook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seedbook}"]
      interval: 5s
      timeout: 5s
      retries: 5

  stock-crawler:
    build:
      context: .
      dockerfile: packages/stock-crawler/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seedbook}:${POSTGRES_PASSWORD:-seedbook}@postgres:5432/${POSTGRES_DB:-seedbook}
      CRON_MORNING: ${CRON_MORNING:-0 6 * * 1-5}
      CRON_AFTERNOON: ${CRON_AFTERNOON:-30 16 * * 1-5}
      NODE_ENV: production

volumes:
  postgres_data:
