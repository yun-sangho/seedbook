// 로컬 Capacitor 플러그인. `cap sync` 가 앱의 capacitor.settings.gradle 에 넣는다.
ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxCoordinatorLayoutVersion = project.hasProperty('androidxCoordinatorLayoutVersion') ? rootProject.ext.androidxCoordinatorLayoutVersion : '1.3.0'
    materialVersion = project.hasProperty('materialVersion') ? rootProject.ext.materialVersion : '1.13.0'
}

apply plugin: 'com.android.library'

// 빌드 결과는 이 패키지가 아니라 앱의 build 폴더 아래에 둔다.
layout.buildDirectory = rootProject.layout.buildDirectory.dir("seedbook-native-plugins")

android {
    namespace = "ing.boogie.seedbook.plugins"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    // 하단 탭바의 BottomNavigationView
    implementation "com.google.android.material:material:$materialVersion"
    // 카카오 로그인 (SeedbookKakaoLoginPlugin)
    implementation "com.kakao.sdk:v2-user:2.26.0"
}
